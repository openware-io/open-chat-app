name: gv_chat_app
description: GV Chat 闁?Flutter client matching gv_chat_h5 UI and behavior.
publish_to: 'none'
version: 2.0.36+121
environment:
  sdk: '>=3.4.4 <4.0.0'
  flutter: '>=3.29.0' 

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  gv_core:
    path: packages/gv_core
  gv_ui:
    path: packages/gv_ui
  dio: ^5.4.3+1
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.2.3
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  get_it: ^8.0.3
  provider: ^6.1.2
  go_router: ^14.2.7
  intl: ^0.20.2
  uuid: ^4.4.0
  crypto: ^3.0.6
  cached_network_image: ^3.3.1
  camera: ^0.12.0+2
  image_picker: ^1.1.2
  pasteboard: ^0.5.0
  file_picker: ^8.0.3
  path_provider: ^2.1.3
  record: ^6.0.0
  audioplayers: ^6.0.0
  # 1.4.x闁挎稒纰嶉弻?Android Surface 闁搞儳鍋犻惃鐔兼晬瀹€鍕級闁?JDK 21+ 閻忓繐妫欏Λ?onSurfaceDestroyed 闁哄秴娲ｇ拹?removal 缂傚倹鐗為惁褎寰勬潏顐バ?
  flutter_webrtc: ^1.4.1
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  # 7.x闁挎稒顒S 闁衡偓閸︻厽鏆?Vision闁挎稑濂旂粭澶愬礃瀹ュ棗顎?GoogleMLKit闁挎稑鐭傛导鈺呭礂瀹ュ嫮鐟?Firebase 闁?GoogleUtilities 8.x 闁告劘灏欓悰?
  mobile_scanner: ^7.2.0
  flutter_slidable: ^3.1.1
  sliding_up_panel: ^2.0.0+1
  qr_flutter: ^4.1.0
  gal: ^2.3.3
  lpinyin: ^2.0.3
  scrollable_positioned_list: ^0.3.8
  crop_your_image: ^2.0.0
  flutter_lucide: ^1.8.2
  video_player: ^2.9.5
  video_thumbnail: ^0.5.6
  image: ^4.3.0
  webview_flutter: ^4.10.0
  jpush_flutter: ^3.4.5
  flutter_local_notifications: ^21.0.0
  package_info_plus: ^8.1.2
  zxing2: ^0.2.4
  web: ^1.1.1
  video_compress: ^3.1.4
  injectable: ^3.0.0
  retrofit: ^4.9.2
  cryptography: ^2.9.0

dependency_overrides:
  # 本地补丁：flutter_webrtc 1.6.0 在 Android Engine detach 时未释放
  # renderer/SurfaceProducer，残留 ImageReader 帧会在 FlutterJNI 分离后触发崩溃。
  flutter_webrtc:
    path: packages/flutter_webrtc
  # 本地补丁：启用 ExoPlayer DefaultRenderersFactory.setEnableDecoderFallback(true)，
  # 使硬件解码器无法处理 4K 等高分辨率视频时自动回退软件解码。
  video_player_android:
    path: packages/video_player_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  injectable_generator: ^3.1.1
  build_runner: ^2.15.0
  retrofit_generator: ^10.2.7
  drift_dev: ^2.34.3

flutter_launcher_icons:
  image_path: assets/app_icon.png
  remove_alpha_ios: true
  android: true
  ios: true
  web:
    generate: true

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/sounds/incoming_call.mp3
    - assets/service_image/bar/
    - assets/service_image/hotel/
    - assets/service_image/ktv/
    - assets/service_image/pool_hall/
    - assets/service_image/foot_bath/

  fonts:
    - family: lucide
      fonts:
        - asset: packages/flutter_lucide/fonts/lucide.ttf
    # 濞?kUnicodeEmojiPalette 閻庣數鎳撶花鏌ユ晬濞戞瑦鐎ù鐘哄煐閺備線宕烽妸鈹库偓宥夋儎椤旂晫澹岄柣鈺婂枛缂嶅秹鏁嶉崼婊呯憿 pubspec.yaml 闁告艾鐬兼鍥晬?
    - family: FluentEmojiColor
      fonts:
        - asset: assets/FluentEmojiColor-Min.ttf
