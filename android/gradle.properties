org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
# 明确 TLS 版本，少数 JDK/网络环境下可缓解 Gradle 拉依赖时的握手问题
systemProp.https.protocols=TLSv1.2,TLSv1.3
android.useAndroidX=true
android.enableJetifier=true

# Windows：多任务同时写 build\ 下 .so 易触发「文件正被另一程序使用」；单 worker 可明显缓解
org.gradle.parallel=false
org.gradle.workers.max=1

# Kotlin 独立编译守护进程在部分 Windows/JDK 组合下会偶发崩溃（控制台出现 Daemon compilation failed: null），
# Gradle 会回退编译故仍能成功。改为进程内编译可避免该噪声，代价是 Kotlin 编译略慢。
kotlin.compiler.execution.strategy=in-process

# 若报错无法下载 storage.googleapis.com/download.flutter.io（Remote host terminated the handshake 等）：
# 在运行 flutter 的终端先设置国内镜像，再 flutter pub get / flutter run：
#   PowerShell: $env:FLUTTER_STORAGE_BASE_URL="https://storage.flutter-io.cn"; $env:PUB_HOSTED_URL="https://pub.flutter-io.cn"
#   CMD: set FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn && set PUB_HOSTED_URL=https://pub.flutter-io.cn
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
